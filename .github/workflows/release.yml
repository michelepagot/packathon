name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Linux x86_64: Standalone binary (.tar.gz), .deb, .rpm, .AppImage (Containerized)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux x86_64 (Tarball, DEB, RPM, AppImage via Containers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian Builder Container
        run: |
          podman build --target builder \
            -t localhost/packathon-debian:builder \
            -f packaging/containers/Containerfile.debian .

      - name: Build openSUSE Builder Container
        run: |
          podman build --target builder \
            -t localhost/packathon-opensuse:builder \
            -f packaging/containers/Containerfile.opensuse .

      - name: Generate DEB and Standalone Tarball (Debian Container)
        run: |
          podman run --rm -v "$PWD:/src:Z" -w /src localhost/packathon-debian:builder

      - name: Generate RPM (openSUSE Container)
        run: |
          podman run --rm -v "$PWD:/src:Z" -w /src localhost/packathon-opensuse:builder

      - name: Build AppImage (Containerized)
        run: |
          podman run --rm -v "$PWD:/src:Z" -w /src \
            -e BUILD_DIR=/tmp/build \
            -e OUTPUT_DIR=/src/dist \
            localhost/packathon-debian:builder \
            ./packaging/appimage/build-appimage.sh

      - name: Verify generated packages in pristine vanilla containers
        run: |
          # 1. Test RPM in pristine openSUSE Tumbleweed
          RPM_FILE=$(ls dist/*.rpm | grep -v 'src\.rpm' | grep -v 'debug' | head -n1)
          echo "Verifying RPM in vanilla openSUSE: $RPM_FILE"
          podman run --rm -v "$PWD/$RPM_FILE:/ocio.rpm:ro,Z" \
            registry.opensuse.org/opensuse/tumbleweed:latest \
            sh -c "zypper --non-interactive in --allow-unsigned-rpm /ocio.rpm && ocio --version"

          # 2. Test DEB in pristine Debian Bookworm
          DEB_FILE=$(ls dist/*.deb | head -n1)
          echo "Verifying DEB in vanilla Debian: $DEB_FILE"
          podman run --rm -v "$PWD/$DEB_FILE:/ocio.deb:ro,Z" \
            debian:bookworm-slim \
            sh -c "apt-get update && apt-get install -y /ocio.deb && ocio --version"

          # 3. Test AppImage in pristine Debian Bookworm
          echo "Verifying AppImage in vanilla Debian"
          podman run --rm -v "$PWD/dist/ocio-x86_64.AppImage:/ocio.AppImage:ro,Z" \
            debian:bookworm-slim \
            /ocio.AppImage --appimage-extract-and-run --version

      - name: Stage Linux artifacts
        run: |
          mkdir -p artifacts
          cp -f dist/*.deb artifacts/ || true
          cp -f dist/*.rpm artifacts/ || true
          # Prefer architecture-tagged tarball if available
          if ls dist/*x86_64.tar.gz 1>/dev/null 2>&1; then
            cp -f dist/*x86_64.tar.gz artifacts/
          else
            cp -f dist/*.tar.gz artifacts/ || true
          fi
          cp -f dist/*.AppImage artifacts/ || true
          echo "=== Staged Linux release artifacts ==="
          ls -lh artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocio-linux-artifacts
          path: artifacts/*

  # ---------------------------------------------------------------------------
  # 2. Windows x86_64: Native executable in .zip
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows x86_64 (ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release

      - name: Package with CPack
        shell: bash
        run: |
          cd build
          cpack -G ZIP
          mkdir -p ../artifacts
          cp *.zip ../artifacts/
          ls -la ../artifacts/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocio-windows-artifacts
          path: artifacts/*

  # ---------------------------------------------------------------------------
  # 3. macOS ARM64 (Apple Silicon): Native executable in .tar.gz
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS ARM64 (Tarball)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release

      - name: Package with CPack
        run: |
          cd build
          cpack -G TGZ
          mkdir -p ../artifacts
          cp *.tar.gz ../artifacts/
          ls -la ../artifacts/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocio-macos-artifacts
          path: artifacts/*

  # ---------------------------------------------------------------------------
  # 4. Flatpak: Sandboxed .flatpak bundle
  # ---------------------------------------------------------------------------
  build-flatpak:
    name: Flatpak Bundle
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flatpak package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ocio.flatpak
          manifest-path: packaging/flatpak/org.packathon.ocio.yml
          run-tests: false

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: ocio-flatpak-artifact
          path: ocio.flatpak

  # ---------------------------------------------------------------------------
  # 5. Publish all artifacts to GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Release Artifacts
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-windows, build-macos, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List collected release assets
        run: |
          echo "=== Release assets ready for publishing ==="
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
