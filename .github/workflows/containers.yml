name: Container Images

"on":
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # Tag pushes ignore path filters, so every release gets semver-tagged images
    paths:
      - 'packaging/containers/**'
      - '.github/workflows/containers.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packaging/containers/**'
      - '.github/workflows/containers.yml'
  # Weekly rebuild: picks up base-image and distro package updates
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.image.distro }}-${{ matrix.image.type_slug }} - ${{ matrix.platform.arch_slug }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - distro: opensuse
            type_slug: demo
            target: vanilla-demo
            file: packaging/containers/Containerfile.opensuse
            title: "Packathon openSUSE Vanilla Demo"
            description: "openSUSE Tumbleweed clean runtime with demo ergonomics (fzf, prompt, history)"
            smoke: "command -v fzf && test -f /root/.bash_history"
          - distro: opensuse
            type_slug: builder
            target: builder
            file: packaging/containers/Containerfile.opensuse
            title: "Packathon openSUSE Builder"
            description: "openSUSE Tumbleweed build tools for ocio: CPack RPM, rpmbuild, AppImage, Flatpak"
            smoke: "cmake --version && rpmbuild --version && appimagetool --version && flatpak-builder --version"
          - distro: debian
            type_slug: demo
            target: vanilla-demo
            file: packaging/containers/Containerfile.debian
            title: "Packathon Debian Vanilla Demo"
            description: "Debian Bookworm clean runtime with demo ergonomics (fzf, prompt, history)"
            smoke: "command -v fzf && test -f /root/.bash_history"
          - distro: debian
            type_slug: builder
            target: builder
            file: packaging/containers/Containerfile.debian
            title: "Packathon Debian Builder"
            description: "Debian Bookworm build tools for ocio: CPack DEB, dpkg-deb, AppImage, Flatpak"
            smoke: "cmake --version && command -v dpkg-shlibdeps && appimagetool --version && flatpak-builder --version"
        platform:
          - os: ubuntu-latest
            arch: linux/amd64
            arch_slug: amd64
          - os: ubuntu-24.04-arm
            arch: linux/arm64
            arch_slug: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.distro }}-${{ matrix.image.type_slug }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}

      # On PR: build and load locally to run smoke test natively on the runner
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: packaging/containers
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.distro }}-${{ matrix.image.type_slug }}-${{ matrix.platform.arch_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.distro }}-${{ matrix.image.type_slug }}-${{ matrix.platform.arch_slug }}

      - name: Verify the tools in the image (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test sh -c '${{ matrix.image.smoke }}'

      # On push: build natively and push single-arch image by digest to GHCR
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: packaging/containers
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.distro }}-${{ matrix.image.type_slug }}-${{ matrix.platform.arch_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.distro }}-${{ matrix.image.type_slug }}-${{ matrix.platform.arch_slug }}

      - name: Verify the tools in the image
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker run --rm "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" sh -c '${{ matrix.image.smoke }}'

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.distro }}-${{ matrix.image.type_slug }}-${{ matrix.platform.arch_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & Publish (${{ matrix.image.distro }}-${{ matrix.image.type_slug }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - distro: opensuse
            type_slug: demo
            title: "Packathon openSUSE Vanilla Demo"
            description: "openSUSE Tumbleweed clean runtime with demo ergonomics (fzf, prompt, history)"
          - distro: opensuse
            type_slug: builder
            title: "Packathon openSUSE Builder"
            description: "openSUSE Tumbleweed build tools for ocio: CPack RPM, rpmbuild, AppImage, Flatpak"
          - distro: debian
            type_slug: demo
            title: "Packathon Debian Vanilla Demo"
            description: "Debian Bookworm clean runtime with demo ergonomics (fzf, prompt, history)"
          - distro: debian
            type_slug: builder
            title: "Packathon Debian Builder"
            description: "Debian Bookworm build tools for ocio: CPack DEB, dpkg-deb, AppImage, Flatpak"

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.distro }}-${{ matrix.image.type_slug }}-*
          merge-multiple: true

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.distro }}-${{ matrix.image.type_slug }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --metadata-file /tmp/metadata.json \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

          manifest_digest=$(jq -r '.["containerimage.descriptor"].digest // empty' /tmp/metadata.json)
          if [ -z "$manifest_digest" ]; then
            first_tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)
            manifest_digest=$(docker buildx imagetools inspect --raw "$first_tag" | sha256sum | awk '{print "sha256:" $1}')
          fi
          echo "digest=$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        run: |
          first_tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker buildx imagetools inspect "$first_tag"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true