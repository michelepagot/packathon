name: Container Images

"on":
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    # Tag pushes ignore path filters, so every release gets semver-tagged builders
    paths:
      - 'packaging/containers/**'
      - '.github/workflows/containers.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'packaging/containers/**'
      - '.github/workflows/containers.yml'
  # Weekly rebuild: picks up base-image and distro package updates
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish (${{ matrix.distro }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: opensuse
            file: packaging/containers/Containerfile.opensuse
            title: "Packathon openSUSE Builder"
            description: "openSUSE Tumbleweed build tools for ocio: CPack RPM, rpmbuild, AppImage, Flatpak"
            smoke: "cmake --version && rpmbuild --version && appimagetool --version && flatpak-builder --version"
          - distro: debian
            file: packaging/containers/Containerfile.debian
            title: "Packathon Debian Builder"
            description: "Debian Bookworm build tools for ocio: CPack DEB, dpkg-deb, AppImage, Flatpak"
            smoke: "cmake --version && command -v dpkg-shlibdeps && appimagetool --version && flatpak-builder --version"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.distro }}-builder" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: packaging/containers
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}

      - name: Verify the build tools in the image
        run: |
          first_tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Testing build tools with tag: $first_tag"
          docker run --rm "$first_tag" sh -c '${{ matrix.smoke }}'

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
