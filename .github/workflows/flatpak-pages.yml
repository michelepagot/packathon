name: Deploy Flatpak Repository to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "packaging/flatpak/**"
      - ".github/workflows/flatpak-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "flatpak-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build OSTree Repository
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Flatpak Builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-cache-${{ hashFiles('packaging/flatpak/org.packathon.ocio.yml') }}
          restore-keys: |
            flatpak-cache-

      # Import GPG key for signing (optional: build is unsigned if secret is not set)
      - name: Setup GPG Signing Key
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> $GITHUB_ENV

      - name: Build Application into OSTree Repo
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/org.packathon.ocio.yml
          repo-dir: public/repo
          gpg-sign: ${{ env.GPG_KEY_ID }}

      - name: Update Static Deltas & Prune
        run: |
          flatpak build-update-repo \
            ${{ env.GPG_KEY_ID && format('--gpg-sign={0}', env.GPG_KEY_ID) || '' }} \
            --generate-static-deltas \
            --prune \
            public/repo

      - name: Copy Reference Descriptors
        run: |
          cp packaging/flatpak/distribution/org.packathon.ocio.flatpakref public/
          cp packaging/flatpak/distribution/org.packathon.ocio.flatpakrepo public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
