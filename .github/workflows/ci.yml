name: CI

on:
  push:
    branches: [ main ]
    # Docs, workflows, and non-build files do not need the CI build matrix
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/slides.yml'
      - '.github/workflows/containers.yml'
      - '.github/workflows/release.yml'
      - '.gitignore'
      - 'LICENSE'
      - '*.png'
      - '.devcontainer/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/slides.yml'
      - '.github/workflows/containers.yml'
      - '.github/workflows/release.yml'
      - '.gitignore'
      - 'LICENSE'
      - '*.png'
      - '.devcontainer/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Path Filter: shared gate for all downstream jobs
  # ===========================================================================
  # Runs dorny/paths-filter once so every build job can reference the same
  # outputs via needs.filter.outputs.*. On non-PR events (push, dispatch)
  # all outputs are forced to "true" so no job is ever skipped.
  # ===========================================================================
  filter:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      rpm: ${{ steps.filter.outputs.rpm }}
      containers: ${{ steps.filter.outputs.containers }}
      meta: ${{ steps.filter.outputs.meta }}
      deb: ${{ steps.filter.outputs.deb }}
      appimage: ${{ steps.filter.outputs.appimage }}
      flatpak: ${{ steps.filter.outputs.flatpak }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Application source: any change here affects every build job
            app:
              - 'src/**'
              - 'CMakeLists.txt'
            # RPM packaging recipe: changes affect the openSUSE rpmbuild step
            rpm:
              - 'packaging/rpm/**'
            # Builder Containerfiles: changes require a --rebuild of the image
            containers:
              - 'packaging/containers/**'
            # Desktop entry, icons, metainfo: changes affect package payload
            meta:
              - 'packaging/ocio.desktop'
              - 'packaging/icons/**'
              - 'packaging/org.packathon.ocio.metainfo.xml'
            # DEB packaging recipe: changes affect the Debian debhelper/frugal steps
            deb:
              - 'packaging/deb/**'
            # AppImage recipe: changes affect the AppImage build step
            appimage:
              - 'packaging/appimage/**'
            # Flatpak manifest: changes affect the Flatpak bundle build
            flatpak:
              - 'packaging/flatpak/**'

      - name: Force all filters true for non-PR events
        if: github.event_name != 'pull_request'
        run: |
          # On push/dispatch the filter step is skipped, so outputs would be
          # empty. Force them to "true" so downstream jobs always run.
          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "rpm=true" >> "$GITHUB_OUTPUT"
          echo "containers=true" >> "$GITHUB_OUTPUT"
          echo "meta=true" >> "$GITHUB_OUTPUT"
          echo "deb=true" >> "$GITHUB_OUTPUT"
          echo "appimage=true" >> "$GITHUB_OUTPUT"
          echo "flatpak=true" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # openSUSE: Builder Image, All openSUSE Build Modes & RPM Verification
  # ===========================================================================
  test-opensuse-containers-and-modes:
    name: openSUSE (Builder Image, Build Modes & RPM Verification)
    runs-on: ubuntu-latest
    # Job-level gate: skip the entire job on PRs that touch none of the
    # paths this job builds against. Without this, a step-level "exit 0"
    # only exits one step and every subsequent build step still runs.
    if: >-
      github.event_name != 'pull_request' ||
      needs.filter.outputs.app == 'true' ||
      needs.filter.outputs.rpm == 'true' ||
      needs.filter.outputs.containers == 'true' ||
      needs.filter.outputs.meta == 'true'
    needs: filter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Builder Image ---
      # --rebuild only when the Containerfile itself changed in this PR;
      # otherwise pull the pre-built image from GHCR.
      - name: Setup openSUSE builder image
        run: ./packaging/containers/setup-builder.sh opensuse ${{ needs.filter.outputs.containers == 'true' && '--rebuild' || '' }}

      # --- Build Modes in openSUSE Containers ---
      - name: "Build Mode: FETCH (Default, static raylib, CPack RPM & TGZ)"
        run: |
          rm -rf dist
          podman run --rm -v "$PWD:/src:Z" -w /src \
            -e RAYLIB_MODE=FETCH -e RAYLIB_SHARED=OFF \
            localhost/packathon-opensuse:builder \
            packaging/containers/build-package.sh
          ls -la dist/
          # The builder also has the distro raylib-devel: static FETCH must not link it
          if readelf -d dist/ocio | grep 'NEEDED.*libraylib'; then
            echo "FETCH build linked a shared libraylib"; exit 1
          fi

      - name: Verify CPack RPM in pristine vanilla openSUSE Tumbleweed
        run: |
          RPM_FILE=$(ls dist/*.rpm | grep -v 'src\.rpm' | grep -v 'debug' | head -n1)
          echo "Testing CPack RPM: $RPM_FILE"
          podman run --rm -v "$PWD/$RPM_FILE:/ocio.rpm:ro,Z" \
            registry.opensuse.org/opensuse/tumbleweed:latest \
            sh -c "zypper --non-interactive in --allow-unsigned-rpm /ocio.rpm && ocio --version && ocio --help"

      # Tumbleweed is rolling: the build must succeed when its raylib-devel
      # matches RAYLIB_VERSION, and stop with the EXACT version error otherwise
      # Disabled: Tumbleweed ships raylib 6.0, so the SYSTEM build is known to
      # fail the EXACT 5.5 check. Re-enable when raylib-devel matches RAYLIB_VERSION
      # (add `set -o pipefail` first, or the `if` tests tee's exit status).
      # - name: "Build Mode: SYSTEM (raylib-devel package, must match RAYLIB_VERSION)"
      #   run: |
      #     rm -rf dist
      #     WANTED=$(sed -n 's/^set(RAYLIB_VERSION \([0-9.]*\))/\1/p' CMakeLists.txt)
      #     FOUND=$(podman run --rm localhost/packathon-opensuse:builder \
      #       rpm -q --qf '%{VERSION}' raylib-devel)
      #     echo "RAYLIB_VERSION=${WANTED}, raylib-devel=${FOUND}"
      #     if podman run --rm -v "$PWD:/src:Z" -w /src \
      #          -e RAYLIB_MODE=SYSTEM \
      #          localhost/packathon-opensuse:builder \
      #          packaging/containers/build-package.sh 2>&1 | tee system-build.log; then
      #       [ "${FOUND}" = "${WANTED}" ] || { echo "SYSTEM build accepted raylib ${FOUND}"; exit 1; }
      #       ls -la dist/
      #     else
      #       [ "${FOUND}" != "${WANTED}" ] || { echo "SYSTEM build failed with matching raylib"; exit 1; }
      #       grep -q "matches requested version \"${WANTED}\"" system-build.log
      #       echo "SYSTEM build refused raylib ${FOUND} as expected"
      #     fi

      - name: "Build Mode: SHARED (libraylib.so)"
        run: |
          rm -rf dist
          podman run --rm -v "$PWD:/src:Z" -w /src \
            -e RAYLIB_SHARED=ON \
            localhost/packathon-opensuse:builder \
            packaging/containers/build-package.sh
          ls -la dist/

      # Uses the system raylib-devel if it matches the spec, vendored raylib otherwise
      - name: "Packaging Mode: Canonical manual rpmbuild (ocio.spec)"
        run: |
          rm -rf dist
          podman run --rm -v "$PWD:/src:Z" -w /src \
            localhost/packathon-opensuse:builder \
            ./packaging/rpm/build-rpm.sh
          ls -la dist/

      - name: Verify canonical manual RPM in pristine vanilla openSUSE Tumbleweed
        run: |
          RPM_FILE=$(ls dist/ocio-[0-9]*.x86_64.rpm | head -n1)
          echo "Testing canonical RPM: $RPM_FILE"
          podman run --rm -v "$PWD/$RPM_FILE:/ocio.rpm:ro,Z" \
            registry.opensuse.org/opensuse/tumbleweed:latest \
            sh -c "zypper --non-interactive in --allow-unsigned-rpm /ocio.rpm && ocio --version"

  # ===========================================================================
  # Debian: Builder Image, All Debian Build Modes & DEB/AppImage Verification
  # ===========================================================================
  test-debian-containers-and-modes:
    name: Debian (Builder Image, Build Modes, DEB, AppImage & Flatpak Verification)
    runs-on: ubuntu-latest
    # Job-level gate: skip the entire job on PRs that touch none of the
    # paths this job builds against.
    if: >-
      github.event_name != 'pull_request' ||
      needs.filter.outputs.app == 'true' ||
      needs.filter.outputs.deb == 'true' ||
      needs.filter.outputs.appimage == 'true' ||
      needs.filter.outputs.flatpak == 'true' ||
      needs.filter.outputs.containers == 'true' ||
      needs.filter.outputs.meta == 'true'
    needs: filter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Builder Image ---
      # --rebuild only when the Containerfile itself changed in this PR;
      # otherwise pull the pre-built image from GHCR.
      - name: Setup Debian builder image
        run: ./packaging/containers/setup-builder.sh debian ${{ needs.filter.outputs.containers == 'true' && '--rebuild' || '' }}

      # --- Build Modes in Debian Containers ---
      - name: "Build Mode: FETCH (Default, static raylib, CPack DEB & TGZ)"
        run: |
          rm -rf dist
          podman run --rm -v "$PWD:/src:Z" -w /src \
            -e RAYLIB_MODE=FETCH -e RAYLIB_SHARED=OFF \
            localhost/packathon-debian:builder \
            packaging/containers/build-package.sh
          ls -la dist/

      - name: Verify CPack DEB in pristine vanilla Debian Bookworm
        run: |
          DEB_FILE=$(ls dist/*.deb | head -n1)
          echo "Testing CPack DEB: $DEB_FILE"
          podman run --rm -v "$PWD/$DEB_FILE:/ocio.deb:ro,Z" \
            debian:bookworm-slim \
            sh -c "apt-get update && apt-get install -y /ocio.deb && ocio --version && ocio --help"

      - name: "Build Mode: LOCAL (Hermetic offline build with pre-staged raylib)"
        run: |
          rm -rf dist build
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git build/_deps/raylib-src
          podman run --rm -v "$PWD:/src:Z" -w /src \
            -e RAYLIB_MODE=LOCAL \
            localhost/packathon-debian:builder \
            packaging/containers/build-package.sh
          rm -rf build
          ls -la dist/

      # Uses canonical Debian source package workflow (dh, debian/rules, dpkg-buildpackage)
      - name: "Packaging Mode: Canonical debhelper (build-deb.sh --mode debhelper)"
        run: |
          rm -rf dist
          podman run --rm -v "$PWD:/src:Z" -w /src \
            localhost/packathon-debian:builder \
            ./packaging/deb/build-deb.sh --mode debhelper
          ls -la dist/

      - name: Verify canonical debhelper DEB in pristine vanilla Debian Bookworm
        run: |
          DEB_FILE=$(ls dist/*.deb | head -n1)
          echo "Testing debhelper DEB: $DEB_FILE"
          podman run --rm -v "$PWD/$DEB_FILE:/ocio.deb:ro,Z" \
            debian:bookworm-slim \
            sh -c "apt-get update && apt-get install -y /ocio.deb && ocio --version && ocio --help"

      # Uses low-level binary packaging workflow (skeleton, dpkg-shlibdeps, dpkg-deb)
      - name: "Packaging Mode: Frugal atomic deb (build-deb.sh --mode frugal)"
        run: |
          rm -rf dist
          podman run --rm -v "$PWD:/src:Z" -w /src \
            localhost/packathon-debian:builder \
            ./packaging/deb/build-deb.sh --mode frugal
          ls -la dist/

      - name: Verify frugal DEB in pristine vanilla Debian Bookworm
        run: |
          DEB_FILE=$(ls dist/*.deb | head -n1)
          echo "Testing frugal DEB: $DEB_FILE"
          podman run --rm -v "$PWD/$DEB_FILE:/ocio.deb:ro,Z" \
            debian:bookworm-slim \
            sh -c "apt-get update && apt-get install -y /ocio.deb && ocio --version && ocio --help"

      - name: "Packaging Mode: AppImage (Containerized appimagetool)"
        run: |
          rm -rf dist
          podman run --rm -v "$PWD:/src:Z" -w /src \
            -e BUILD_DIR=/tmp/build \
            -e OUTPUT_DIR=/src/dist \
            localhost/packathon-debian:builder \
            ./packaging/appimage/build-appimage.sh
          ls -la dist/

      - name: Verify AppImage in pristine vanilla Debian Bookworm
        run: |
          echo "Testing AppImage: dist/ocio-x86_64.AppImage"
          podman run --rm -v "$PWD/dist/ocio-x86_64.AppImage:/ocio.AppImage:ro,Z" \
            debian:bookworm-slim \
            /ocio.AppImage --appimage-extract-and-run --version

      - name: "Packaging Mode: Flatpak (Containerized build-flatpak.sh)"
        run: |
          rm -rf dist
          podman run --privileged --rm -v "$PWD:/src:Z" -w /src \
            localhost/packathon-debian:builder \
            ./packaging/flatpak/build-flatpak.sh
          ls -la dist/

      # - name: Verify Flatpak bundle in Debian builder container
      #   run: |
      #     echo "Testing Flatpak: dist/ocio.flatpak"
      #     podman run --privileged --rm -v "$PWD/dist:/dist:ro,Z" \
      #       localhost/packathon-debian:builder \
      #       sh -c "flatpak install -y --user /dist/ocio.flatpak && flatpak run org.packathon.ocio --version"

  # ===========================================================================
  # Flatpak Packaging
  # ===========================================================================
  test-flatpak:
    name: Flatpak Bundle Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    # Job-level gate: skip the entire job on PRs that touch neither the
    # application source nor the Flatpak manifest.
    if: >-
      github.event_name != 'pull_request' ||
      needs.filter.outputs.app == 'true' ||
      needs.filter.outputs.flatpak == 'true'
    needs: filter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Flatpak Builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('packaging/flatpak/org.packathon.ocio.yml') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      - name: Build Flatpak package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ocio.flatpak
          manifest-path: packaging/flatpak/org.packathon.ocio.yml
          run-tests: false

      # The flatpak-builder action does NOT create repo-dir, so it must exist
      # before the build or the OSTree export fails with
      # "mkdirat: No such file or directory".
      - name: Prepare OSTree working directory
        run: |
          mkdir -p ostree-repo
          ostree init --mode=archive-z2 --repo=ostree-repo

      - name: Build Application into OSTree Repo
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/org.packathon.ocio.yml
          repo-dir: ostree-repo
          run-tests: false

      - name: Update Static Deltas & Prune
        run: |
          flatpak build-update-repo \
            --generate-static-deltas \
            --prune \
            ostree-repo

      - name: Verify repo contents
        run: |
          ls -la ostree-repo/
          # ls only proves the repo directory was created. The ostree log
          # proves the app was actually committed into it: it resolves the
          # ref (a named pointer to a commit, like a git branch) and prints
          # the commit history. If the export failed to write the app, this
          # ref would not exist and the step fails.
          ostree --repo=ostree-repo log app/org.packathon.ocio/x86_64/master

  # ===========================================================================
  # Host Sanity Build
  # ===========================================================================
  test-host-sanity:
    name: Host Sanity Build (Ubuntu)
    runs-on: ubuntu-latest
    # Job-level gate: skip on PRs that do not touch application source.
    # This job compiles ocio directly on the Ubuntu runner (no container),
    # so only src/ and CMakeLists.txt changes are relevant.
    if: >-
      github.event_name != 'pull_request' ||
      needs.filter.outputs.app == 'true'
    needs: filter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev rpm

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build ocio
        run: cmake --build build --config Release --parallel

      - name: Test CLI flags
        run: |
          ./build/bin/ocio --version
          ./build/bin/ocio --help

  # ===========================================================================
  # Windows Sanity Build (MSVC)
  # ===========================================================================
  test-windows:
    name: Windows Build (MSVC)
    runs-on: windows-latest
    # Job-level gate: skip on PRs that do not touch application source.
    # This job compiles ocio with MSVC on a bare Windows runner,
    # so only src/ and CMakeLists.txt changes are relevant.
    if: >-
      github.event_name != 'pull_request' ||
      needs.filter.outputs.app == 'true'
    needs: filter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build ocio
        run: cmake --build build --config Release --parallel

      - name: Test CLI flags
        run: |
          Get-ChildItem -Recurse -Filter "ocio.exe" build | Select-Object -First 1 | ForEach-Object {
            & $_.FullName --version
            & $_.FullName --help
          }

  # ===========================================================================
  # macOS Sanity Build (Apple Silicon)
  # ===========================================================================
  test-macos:
    name: macOS Build (Apple Silicon)
    runs-on: macos-14
    # Job-level gate: skip on PRs that do not touch application source.
    # This job compiles ocio with Clang on a bare macOS runner,
    # so only src/ and CMakeLists.txt changes are relevant.
    if: >-
      github.event_name != 'pull_request' ||
      needs.filter.outputs.app == 'true'
    needs: filter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build ocio
        run: cmake --build build --config Release --parallel

      - name: Test CLI flags
        run: |
          ./build/bin/ocio --version
          ./build/bin/ocio --help
