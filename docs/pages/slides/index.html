<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Packathon - Presentation</title>

    <!-- Reveal.js styles via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/theme/black.min.css" id="theme">
    <!-- Code syntax highlighting theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/plugin/highlight/monokai.min.css">

    <style>
      /* Top navigation overlay bar: fixed full-width header positioning back-link and language switcher.
         pointer-events: none ensures transparent pass-through for mouse interactions over the slides. */
      .top-nav {
        position: fixed;
        top: 15px;
        left: 15px;
        right: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        pointer-events: none;
      }

      /* Interactive controls in top bar (home link and language toggle buttons).
         pointer-events: auto restores clickability; styled as semi-transparent frosted pills. */
      .top-nav a,
      .top-nav button {
        pointer-events: auto;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.2s ease;
        font-size: 13px;
        cursor: pointer;
      }

      /* Hover state for top bar controls: increases background opacity and border contrast for visual feedback. */
      .top-nav a:hover,
      .top-nav button:hover {
        color: #fff;
        background: rgba(0, 0, 0, 0.75);
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* Language toggle container: flex wrapper managing horizontal spacing between locale buttons. */
      .lang-switcher {
        display: flex;
        gap: 6px;
      }

      /* Active language indicator: highlights the currently selected locale with accent blue background and bold weight. */
      .lang-btn.active {
        color: #fff;
        background: rgba(3, 102, 214, 0.75);
        border-color: rgba(3, 102, 214, 0.9);
        font-weight: 600;
      }

      /* Cardboard box scene in the lower-right quarter */
      #artCanvas {
        position: fixed;
        bottom: 0;
        right: 0;
        width: 40vw;
        height: 40vh;
        z-index: 1;
        pointer-events: none;
      }

      /* Ensure slide content appears on top of the background canvas */
      .reveal .slides {
        z-index: 2;
      }

      /* Slide layout and typographic normalization */
      .reveal .slides section {
        text-align: left;
      }

      .reveal .text-center,
      .reveal .slides section:first-child,
      .reveal .slides section.text-center,
      .reveal .slides section.center {
        text-align: center;
      }

      /* Multi-column layout */
      .reveal .grid-2 {
        display: flex;
        gap: 35px;
        align-items: flex-start;
      }

      .reveal .grid-2 > * {
        flex: 1;
        min-width: 0;
      }

      /* Centered media/card blocks */
      .reveal .center-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
      }


      /* Semantic highlight colors */
      .reveal .text-muted   { color: #9ca3af; }
      .reveal .text-warn    { color: #ffb74d; }
      .reveal .text-info    { color: #4fc3f7; }
      .reveal .text-success { color: #81c784; }
      .reveal .text-danger  { color: #e57373; }

      /* Visual accent boxes */
      .reveal .box-success {
        border-left: 3px solid #81c784;
        padding-left: 15px;
      }

      .reveal .box-danger {
        border-left: 3px solid #e57373;
        padding-left: 15px;
      }

      .reveal .callout {
        background: rgba(255, 255, 255, 0.05);
        border-left: 4px solid #4fc3f7;
        padding: 15px 20px;
        border-radius: 6px;
        margin-top: 20px;
      }

      /* Table and pre/code formatting */
      .reveal table {
        font-size: 0.82em;
        width: 100%;
        margin: 20px 0;
        border-collapse: collapse;
      }

      .reveal table th,
      .reveal table td {
        padding: 8px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }

      .reveal pre {
        width: 100%;
        margin: 15px 0;
        box-shadow: none;
        font-size: 0.68em;
      }

      .reveal pre code {
        padding: 12px;
        border-radius: 6px;
        max-height: 520px;
      }

      /* Hide navigation in speaker-view receiver preview iframes */
      body.receiver .top-nav {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="top-nav">
      <a href="../" title="Back to Project Overview">&larr; Back to Home</a>
      <div class="lang-switcher">
        <button id="btn-en" class="lang-btn" onclick="switchLanguage('en')" title="Switch to English (or press 'L')">🇬🇧 EN</button>
        <button id="btn-it" class="lang-btn" onclick="switchLanguage('it')" title="Passa all'Italiano (o premi 'L')">🇮🇹 IT</button>
      </div>
    </header>

    <!-- Background procedural cardboard box canvas (lower-right 1/4) -->
    <canvas id="artCanvas"></canvas>

    <div class="reveal">
      <div class="slides">
        <!-- Markdown slides will be loaded dynamically based on language -->
        <section id="slide-source"
                 data-separator="^\r?\n---\r?\n$"
                 data-separator-vertical="^\r?\n--\r?\n$"
                 data-separator-notes="^Note:">
        </section>
      </div>
    </div>

    <!-- Reveal.js Scripts via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/reveal.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/plugin/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/plugin/highlight/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/plugin/notes/notes.min.js"></script>

    <!-- Procedural Cardboard Box Engine -->
    <script src="box-art.js"></script>

    <script>
      // Determine language: URL param (?lang=it) or default to 'en'
      const urlParams = new URLSearchParams(window.location.search);
      const currentLang = urlParams.get('lang') === 'it' ? 'it' : 'en';

      // Check for speaker-view receiver mode
      if (urlParams.has('receiver')) {
        document.body.classList.add('receiver');
      }

      // Configure dynamic markdown source
      const slideSource = document.getElementById('slide-source');
      slideSource.setAttribute('data-markdown', `slides-${currentLang}.md`);

      // Highlight active button in switcher
      document.getElementById(`btn-${currentLang}`).classList.add('active');
      document.documentElement.lang = currentLang;

      // Switch language function (preserves current slide hash)
      function switchLanguage(newLang) {
        if (newLang === currentLang) return;
        const url = new URL(window.location.href);
        url.searchParams.set('lang', newLang);
        window.location.href = url.toString();
      }

      // Keyboard shortcut: Press 'L' to toggle language
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'l' || e.key === 'L') && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const target = e.target.tagName;
          if (target !== 'INPUT' && target !== 'TEXTAREA') {
            switchLanguage(currentLang === 'it' ? 'en' : 'it');
          }
        }
      });

      // Initialize Box Renderer
      const app = window.initBoxArt ? window.initBoxArt('artCanvas') : null;

      // Initialize Reveal.js and bind slide change events
      Reveal.on('slidechanged', () => {
        if (app) app.generate();
      });

      Reveal.initialize({
        hash: true,
        totalTime: 2400, // 40 minutes target pacing
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
      }).then(() => {
        if (app) {
          app.resize();
          app.generate();
        }
      });
    </script>
  </body>
</html>
